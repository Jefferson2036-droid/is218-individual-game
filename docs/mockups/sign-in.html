<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Climb – Sign in</title>
<!-- Static design mockup (2026-11-23). Reference for implementation, not production code. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16182A}
a{color:#F2B84B}a:hover{color:#FFD27A}
.px{image-rendering:pixelated}
.stone{background-color:#2B2F45;background-image:linear-gradient(#20233A 2px,transparent 2px),linear-gradient(90deg,#20233A 2px,transparent 2px);background-size:48px 24px}
</style>
<style>body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16182A; color: #F4EBD0; font-family: 'Pixelify Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div class="stone" style="height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 24px 0; border-bottom: 4px solid #3B4163; position: relative">
    <div style="position: absolute; top: 40px; left: 28px; width: 12px; height: 20px; background: #F2B84B; box-shadow: 0 0 18px 6px rgba(242,184,75,0.45)"></div>
    <div style="position: absolute; top: 40px; right: 28px; width: 12px; height: 20px; background: #F2B84B; box-shadow: 0 0 18px 6px rgba(242,184,75,0.45)"></div>
    <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 30px; line-height: 1.25; text-align: center; color: #F2B84B; text-shadow: 4px 4px 0 #16182A">ARENA<br>CLIMB</h1>
    <p style="margin: 0; font-size: 18px; text-align: center; color: #F4EBD0">Knight. Archer. Wizard. Climb the ranks.</p>
    <div style="display: flex; align-items: flex-end; gap: 22px; margin-bottom: -4px">
      <img class="px" src="img/knight-px.png" alt="Knight" style="height: 120px">
      <img class="px" src="img/archer-px.png" alt="Archer" style="height: 120px">
      <img class="px" src="img/wizard-px.png" alt="Wizard" style="height: 120px">
    </div>
  </div>
  <form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 32px 28px">
    <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #F4EBD0">SIGN IN</h2>
    <label for="u" style="display: flex; flex-direction: column; gap: 6px; font-size: 17px">Username
      <input id="u" type="text" value="jeff" style="height: 48px; box-sizing: border-box; padding: 0 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; color: #F4EBD0; background: #262A40; border: 3px solid #3B4163; border-radius: 0">
    </label>
    <label for="p" style="display: flex; flex-direction: column; gap: 6px; font-size: 17px">Password
      <input id="p" type="password" value="password1" style="height: 48px; box-sizing: border-box; padding: 0 14px; font-size: 18px; color: #F4EBD0; background: #262A40; border: 3px solid #3B4163; border-radius: 0">
    </label>
    <a href="battle.html" style="display: flex; align-items: center; justify-content: center; height: 54px; margin-top: 8px; background: #F2B84B; color: #16182A; text-decoration: none; font-family: 'Press Start 2P', monospace; font-size: 14px; box-shadow: 4px 4px 0 #9C6B17">ENTER ARENA</a>
    <p style="margin: 4px 0 0; font-size: 17px; text-align: center; color: #C9C2AC">New here? <a href="#">Create an account</a></p>
  </form>
</div>
</body>
</html>
