# Local development: the API plus a PostgreSQL database.
#   docker compose up --build      then open http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_dev_only}
      POSTGRES_DB: arena
    volumes:
      - arena_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://arena:${POSTGRES_PASSWORD:-arena_dev_only}@db:5432/arena
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-before-deploying-0123456789}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  arena_db:
